name: Apply reviewed countdown repair
on:
  push:
    branches: [fix/recording-countdown-ring]
    paths: [.github/workflows/apply-countdown-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply the exact reviewed patch and verify countdown regressions
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/recording-countdown-ring
          test -z "$(git status --porcelain)"
          git apply --check scripts/countdown-native.patch
          git apply --index scripts/countdown-native.patch
          node --test scripts/countdown-clock.test.mjs scripts/capture-runtime-boundary.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          for name in ['README.md','README_ZH.md']:
              p=Path(name);s=p.read_text(encoding='utf-8')
              old='输出 MP4 或 GIF。'
              assert s.count(old)==1
              p.write_text(s.replace(old,'开始前显示圆环倒计时，可点击取消或按 Esc 退出；输出 MP4 或 GIF。'),encoding='utf-8')
          PY
          git rm -- scripts/countdown-native.patch .github/workflows/apply-countdown-fix.yml
          git add -- README.md README_ZH.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: synchronize countdown readiness, focus and cancellation with recording state'
          git push origin HEAD:refs/heads/fix/recording-countdown-ring
