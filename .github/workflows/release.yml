name: release

# A v* tag verifies the source version and lets Windows produce a draft NSIS
# release. macOS DMGs are packaged and verified by a maintainer on a trusted
# Mac with the project's long-lived local signing identity, then attached to
# the draft manually. CI must never substitute an ad-hoc macOS identity.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/release-version.mjs "$GITHUB_REF_NAME"

  build-windows:
    name: Build Windows app
    needs: verify-version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - name: Read reviewed bilingual release notes
        id: release-notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const path = `docs/releases/${process.env.GITHUB_REF_NAME}.md`;
          const notes = fs.readFileSync(path, 'utf8').trim();
          if (!/^## English$/m.test(notes) || !/^## 中文$/m.test(notes) ||
              notes.indexOf('## English') > notes.indexOf('## 中文')) {
            throw new Error(`${path} must contain reviewed English-first bilingual release notes`);
          }
          const delimiter = randomUUID();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${notes}\n${delimiter}\n`);
          NODE
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kiri ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --bundles nsis

      - name: Package and verify portable Windows build
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1

      - name: Install and smoke-test both Windows packages
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -m pip install pywinauto==0.6.9
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $install = Join-Path $env:RUNNER_TEMP 'kiri-installed-review'
          $installerProcess = Start-Process $installers[0].FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($installerProcess.ExitCode -ne 0) { throw "NSIS installation failed: $($installerProcess.ExitCode)" }
          $env:KIRI_QA_PORTABLE_EXE = Join-Path $env:RUNNER_TEMP 'kiri-portable-verify/kiri.exe'
          $env:KIRI_QA_INSTALLED_EXE = Join-Path $install 'kiri.exe'
          python scripts/qa/windows-release-native.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-release-review
          path: windows-release-review/
          retention-days: 5
          if-no-files-found: warn

      - name: Upload portable package to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release upload "${{ github.ref_name }}" "Kiri-$version-Windows-x64-Portable.zip" --clobber
