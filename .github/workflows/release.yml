name: release

# A v* tag verifies the source version and lets Windows produce a draft NSIS
# release. macOS packaging intentionally fails closed until CI has a persistent
# private-key-backed signing identity and verifies the final app identity.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/release-version.mjs "$GITHUB_REF_NAME"

  build-macos:
    name: Block macOS release packaging
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Require a persistent macOS release identity
        shell: bash
        run: |
          cat >&2 <<'EOF'
          macOS release packaging is intentionally fail-closed.

          Configure one persistent private-key-backed release certificate,
          import it into an ephemeral CI keychain, pin its fingerprint, and
          verify the final app's designated requirement before restoring this
          job. Publishing another ad-hoc build would reset Screen Recording,
          Input Monitoring, and Microphone authorization after an upgrade.
          EOF
          exit 1

  build-windows:
    name: Build Windows app
    needs: verify-version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kiri ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles nsis
