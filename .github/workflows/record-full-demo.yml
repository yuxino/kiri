name: Record complete project demonstration
on:
  push:
    branches: [docs/complete-recording-demo]
    paths: [.github/workflows/record-full-demo.yml, 'docs/demos/full-flow/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: record-complete-project-demo
  cancel-in-progress: true
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          run-id: 34022248971
          name: countdown-renderer-review
          github-token: ${{ github.token }}
          path: reviewed-build
      - name: Install isolated documentation tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Verify the actual continuous interface workflow
        env:
          KIRI_DEMO_DIST: ${{ github.workspace }}/reviewed-build/dist
          KIRI_DEMO_OUT: ${{ github.workspace }}/full-flow-review
          CHROME_BIN: /usr/bin/google-chrome
        run: python docs/demos/full-flow/record.py --fast
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-flow-review
          path: full-flow-review/
          retention-days: 5
          if-no-files-found: error
