name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  countdown-ui:
    name: Countdown renderer checks
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - run: pnpm build
      - run: python -m pip install playwright==1.55.0 imageio-ffmpeg==0.6.0 Pillow==11.3.0
      - run: python scripts/qa/countdown-ui.py --record
      - name: Verify OCR waits for a committed selection
        run: python docs/demos/full-flow/test-ocr.py
        env:
          KIRI_DEMO_DIST: ${{ github.workspace }}/dist
          KIRI_DEMO_OUT: ${{ runner.temp }}/ocr-selection-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: countdown-renderer-review
          path: |
            countdown-review/
            ${{ runner.temp }}/ocr-selection-review/
            dist/
          retention-days: 5
          if-no-files-found: warn

  test-rust:
    name: Rust tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  test-rust-linux:
    name: Rust check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

  build-macos:
    name: Compile macOS app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - name: Compile without a runnable macOS bundle
        run: pnpm tauri build --no-bundle

  build-windows:
    name: Build and test Windows app (Server 2025)
    runs-on: windows-2025
    env:
      # Keep optimized runtime behavior, with symbols for native crash reports.
      CARGO_PROFILE_RELEASE_DEBUG: "1"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - name: Run Windows regression and native video export tests
        timeout-minutes: 20
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          KIRI_VIDEO_QA_DIR: ${{ runner.temp }}/kiri-video-export-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-video-export-review
          path: ${{ runner.temp }}/kiri-video-export-review/
          retention-days: 5
          if-no-files-found: warn
      - name: Compile Windows app for pull requests
        if: github.event_name == 'pull_request'
        run: pnpm tauri build --no-bundle
      - uses: tauri-apps/tauri-action@v0
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify countdown and recording controls on the actual desktop
        timeout-minutes: 4
        run: |
          python -m pip install pywinauto==0.6.9
          python scripts/qa/countdown-native.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: countdown-native-review
          path: countdown-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: countdown-debug-build
          path: |
            src-tauri/target/release/kiri.exe
            src-tauri/target/release/*.pdb
          retention-days: 2
          if-no-files-found: warn
      - name: Upload Windows bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: kiri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
