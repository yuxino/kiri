name: Verify macOS fullscreen shortcut overlay
on:
  push:
    branches: [fix/macos-fullscreen-shortcut]
    paths:
      - '.github/workflows/fix-macos-fullscreen-shortcut.yml'
      - 'scripts/maintenance/fix-macos-fullscreen-shortcut.py'
permissions:
  contents: write
concurrency:
  group: fix-macos-fullscreen-shortcut
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Apply bounded fix
        run: python scripts/maintenance/fix-macos-fullscreen-shortcut.py
      - name: Commit fix and remove one-time workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/maintenance/fix-macos-fullscreen-shortcut.py .github/workflows/fix-macos-fullscreen-shortcut.yml
          git add src-tauri/src/platform/macos.rs src-tauri/src/commands.rs docs/architecture.md docs/adr/0029-macos-fullscreen-shortcut-overlay.md scripts/maintenance/fix-macos-fullscreen-shortcut.py .github/workflows/fix-macos-fullscreen-shortcut.yml
          git diff --cached --check
          git commit -m 'fix: keep shortcut capture over macOS full-screen apps'
          git fetch origin fix/macos-fullscreen-shortcut
          test "$(git rev-parse origin/fix/macos-fullscreen-shortcut)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/macos-fullscreen-shortcut
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  macos:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.prepare.outputs.sha }}' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --no-bundle
  windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.prepare.outputs.sha }}' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --no-bundle
