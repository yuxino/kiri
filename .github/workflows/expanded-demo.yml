name: Expanded 10x documentation demos
on:
  push:
    branches: [docs/demo-expanded-10x]
    paths: ['.github/workflows/expanded-demo.yml', 'docs/demos/capture/expanded.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: expanded-demo-capture
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 33984702908
          pattern: demo-frontend-*
          path: docs/demos/capture/dist
      - name: Install documentation tools only
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0 reportlab==4.4.3
          python -m playwright install ffmpeg
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Generate original sample documents
        run: python -I docs/demos/capture/fixtures.py
      - name: Record richer interactions at 10x with readable result holds
        run: python -I docs/demos/capture/expanded.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: expanded-demo-review
          path: docs/demos/capture/expanded/
          if-no-files-found: error
          retention-days: 5
