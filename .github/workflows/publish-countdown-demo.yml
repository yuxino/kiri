name: Publish tested countdown demonstration
on:
  push:
    branches: [docs/show-black-countdown-demo]
    paths: [.github/workflows/publish-countdown-demo.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 34022248971
          name: countdown-renderer-review
          path: ${{ runner.temp }}/countdown-demo-source
      - name: Verify the existing recording and add its visible preview
        env:
          COUNTDOWN_SOURCE: ${{ runner.temp }}/countdown-demo-source/countdown-review
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ffmpeg
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess

          def run(args):
              return subprocess.check_output(args, text=True)
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def probe(path):
              return json.loads(run(['ffprobe','-v','error','-show_entries','stream=width,height,codec_name:format=duration','-of','json',str(path)]))

          assert run(['git','branch','--show-current']).strip() == 'docs/show-black-countdown-demo'
          assert not run(['git','status','--porcelain']).strip(), 'Worktree must be clean'
          assert run(['git','rev-parse','HEAD']).strip() == os.environ['GITHUB_SHA']
          src = Path(os.environ['COUNTDOWN_SOURCE'])
          video = src/'countdown-black.mp4'
          expected = 'f59644a547f8f8eaa8a675a8fa6916126b3be63593fb6a3f6df242b5eeff37aa'
          assert sha(video) == expected
          source_info = json.loads((src/'video-provenance.json').read_text())
          checks = json.loads((src/'ui-tests.json').read_text())
          assert source_info['sha256'] == expected
          assert source_info['observed_numerals'] == ['3','2','1']
          assert len(checks['passed']) == 8 and checks['native'] is False
          assert checks['palette']['number'] == 'rgb(17, 17, 17)'
          info = probe(video)
          assert info['streams'][0]['codec_name'] == 'h264'
          assert [info['streams'][0]['width'],info['streams'][0]['height']] == [1920,1080]
          assert 2.9 < float(info['format']['duration']) < 3.2
          full_video = Path('docs/demos/demo.mp4')
          original_full_sha = sha(full_video)
          assert original_full_sha == 'b8d0fb08852940c475a61f0a89bd45532c94d7482be48430d8599512c8217149'

          target = Path('docs/demos')
          new_video = target/'countdown-black.mp4'
          gif = target/'countdown-black.gif'
          provenance = target/'countdown-black.provenance.json'
          assert all(not p.exists() for p in [new_video,gif,provenance])
          new_video.write_bytes(video.read_bytes())
          # Spatial crop only: remove empty margins, retain every instant and UI pixel.
          filters = 'crop=720:640:600:280,fps=15,split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse=dither=none'
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(new_video),'-filter_complex',filters,'-loop','0',str(gif)],check=True)
          for media in [new_video,gif]:
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-i',str(media),'-f','null','-'],check=True)
              assert media.stat().st_size < 500000
          gif_info = probe(gif)
          assert [gif_info['streams'][0]['width'],gif_info['streams'][0]['height']] == [720,640]
          assert abs(float(gif_info['format']['duration'])-float(info['format']['duration'])) < .2
          provenance.write_text(json.dumps({
              'source_run':34022248971,
              'source_artifact':9985893052,
              'source_commit':source_info['source_commit'],
              'visual_source':source_info['visual_source'],
              'native_ipc':source_info['native_ipc'],
              'speed_factor':1,
              'scene_cuts':0,
              'extra_holds':0,
              'gif_crop':[600,280,720,640],
              'checks':checks['passed'],
              'disclosure':'Separate recording of the actual built countdown component with isolated IPC. The native full-workflow video remains unchanged because protected countdown/control windows are intentionally excluded from screen capture. No protection was disabled and no countdown was composited into that video.',
              'media':{p.name:{'bytes':p.stat().st_size,'sha256':sha(p)} for p in [new_video,gif]},
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          files = {'README.md':'录屏倒计时','README_ZH.md':'录屏倒计时','README_EN.md':'Recording countdown','README_JA.md':'録画カウントダウン'}
          expected_blobs = {'README.md':'883d83f0647b5614d2a22956f5106114e2d1f66a','README_ZH.md':'883d83f0647b5614d2a22956f5106114e2d1f66a','README_EN.md':'77c92bd8edd8301536ebe3d330003861b4669ee0','README_JA.md':'b712d717069c2913a9e8bd71256bcff78c3fe41d'}
          marker = '<!-- /project-demo-v1 -->'
          for filename,label in files.items():
              p = Path(filename)
              assert run(['git','hash-object',filename]).strip() == expected_blobs[filename], 'README changed since inspection'
              text = p.read_text(encoding='utf-8')
              assert text.count(marker) == 1 and 'countdown-black.mp4' not in text
              block = f'\n[{label}](docs/demos/countdown-black.mp4)\n\n<a href="docs/demos/countdown-black.mp4"><img src="docs/demos/countdown-black.gif" width="360" alt="{label}"></a>\n'
              p.write_text(text.replace(marker,block+marker),encoding='utf-8')
          assert Path('README.md').read_bytes() == Path('README_ZH.md').read_bytes()
          assert sha(full_video) == original_full_sha, 'Do not overwrite or splice the full native demo'
          staged = list(files) + [str(p) for p in [new_video,gif,provenance]]
          subprocess.run(['git','add','--',*staged],check=True)
          subprocess.run(['git','rm','--','.github/workflows/publish-countdown-demo.yml'],check=True)
          changed = set(run(['git','diff','--cached','--name-only']).splitlines())
          assert changed == set(staged+['.github/workflows/publish-countdown-demo.yml'])
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','docs: show the black countdown animation and video alongside the full demo'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/docs/show-black-countdown-demo'],check=True)
          print('Published verified countdown media without altering the native full demo or runtime capture policy.')
          PY
