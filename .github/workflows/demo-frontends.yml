name: Build demo frontends
on:
  push:
    branches: [docs/project-demo-v1]
    paths: [.github/workflows/demo-frontends.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {repo: kiri, ref: d3ebccbe86f1df4990651ce1e2569a60d88646fb}
          - {repo: mimi, ref: 4bbcde72b9bcb9a2540f0b230c8ce45d842a50dc}
          - {repo: satori, ref: f31740ce5f7f722f1adffc52ce12d08c3e05b7f6}
          - {repo: viva, ref: f026142b7d53d5a41831872b40aef735fa66c246}
          - {repo: tick, ref: cfd84896f682d80967f7791b1221f1097dd06ad8}
          - {repo: wnacg, ref: 062e0a39c70cc7b37872863ae34e9ba538e2a0e2}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: yuxino/${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked dependencies and compile only the existing frontend
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            version=$(node -p "(require('./package.json').packageManager || 'pnpm@11.24.0').split('@')[1].split('+')[0]")
            npm install --global "pnpm@$version"
            pnpm install --frozen-lockfile
            pnpm build
          else
            npm ci
            npm run build
          fi
          printf '%s\n' '${{ matrix.ref }}' > dist/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: demo-frontend-${{ matrix.repo }}
          path: dist/
          retention-days: 2
          if-no-files-found: error
