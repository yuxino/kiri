name: Documentation UI capture
on:
  push:
    branches: [docs/project-demo-v1]
    paths: ['.github/workflows/demo-ui-capture.yml', 'scripts/demos/bridge.js', 'scripts/demos/fixtures.py', 'scripts/demos/record.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: documentation-ui-capture
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the immutable production frontend builds
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 33984702908
          pattern: demo-frontend-*
          path: scripts/demos/dist
      - name: Install documentation tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0 reportlab==4.4.3
          python -m playwright install ffmpeg
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          google-chrome --version
      - name: Generate original sample files
        run: python -I scripts/demos/fixtures.py
      - name: Record actual UI actions and encode H.264 MP4s
        run: python -I scripts/demos/record.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: project-demo-recordings
          path: scripts/demos/recordings/
          retention-days: 2
          if-no-files-found: error
