name: Verify v1.4.10 OCR and demo
on:
  push:
    branches: [release/v1.4.10-demo-polish]
    paths:
      - '.github/workflows/finish-v1.4.10-demo.yml'
      - 'scripts/maintenance/finish-v1.4.10-ocr.py'
permissions:
  contents: write
concurrency:
  group: finish-kiri-v1.4.10
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Reproduce the regression then apply the minimal fix
        shell: bash
        run: |
          set -euo pipefail
          git status -sb
          test -z "$(git status --porcelain)"
          if node --test scripts/ocr-selection-commit.test.mjs > "$RUNNER_TEMP/ocr-before.txt" 2>&1; then
            echo 'Expected the new regression checks to fail against the old implementation'; exit 1
          fi
          python scripts/maintenance/finish-v1.4.10-ocr.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('docs/demos/full-flow').glob('*.py'): ast.parse(p.read_text())
          PY
          git diff --check
      - run: pnpm test:release-tools
      - run: pnpm build
      - name: Commit the exact source used for the recording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/windows/OverlayWindow.tsx package.json .github/workflows/build.yml docs/architecture.md docs/adr/0028-ocr-committed-selection.md docs/releases/v1.4.10.md docs/demos/full-flow docs/demos/capture/record.py
          git diff --cached --check
          git commit -m 'fix: recognize the complete OCR region only after pointer release'
          echo "KIRI_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KIRI_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "KIRI_DEMO_DIST=$GITHUB_WORKSPACE/dist" >> "$GITHUB_ENV"
          echo "KIRI_DEMO_OUT=$RUNNER_TEMP/kiri-demo-review" >> "$GITHUB_ENV"
          echo "FULL_FLOW_REVIEW=$RUNNER_TEMP/kiri-demo-review" >> "$GITHUB_ENV"
          echo "FULL_FLOW_DELIVERY=$RUNNER_TEMP/kiri-demo-delivery" >> "$GITHUB_ENV"
      - name: Install recording-only dependencies
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Verify actual crop bounds and single preparation
        run: python docs/demos/full-flow/test-ocr.py
      - name: Record the complete single-take demo
        run: python docs/demos/full-flow/record.py
      - name: Encode and verify the main video and preview
        run: python docs/demos/full-flow/package.py
      - name: Commit only verified media and clean temporary preparation files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil
          source=Path(os.environ['FULL_FLOW_DELIVERY']);target=Path('docs/demos')
          d=json.loads((source/'provenance.json').read_text())
          assert d['action_speed']==10 and d['scene_cuts']==0 and d['checks']['no_recording_cancel_demo']
          assert d['checks']['ocr_lines']>=12 and d['checks']['ocr_request_count']==1
          assert d['checks']['ocr_selection']=={'x':194,'y':104,'width':896,'height':537}
          assert d['ending_hold_seconds']>=5.9
          for name,check in d['media'].items():
              blob=(source/name).read_bytes()
              assert len(blob)==check['bytes'] and hashlib.sha256(blob).hexdigest()==check['sha256']
          for name in ['demo.mp4','preview.gif','poster.png','provenance.json','README.md']:shutil.copyfile(source/name,target/name)
          stamp=d['media']['preview.gif']['sha256'][:12]
          for path in [Path('README.md'),Path('README_ZH.md'),Path('README_EN.md'),Path('README_JA.md')]:
              if path.exists():path.write_text(re.sub(r'docs/demos/preview\.gif(?:\?v=[a-f0-9]+)?','docs/demos/preview.gif?v='+stamp,path.read_text()))
          assert not list(target.rglob('*.pyc'))
          PY
          rm scripts/maintenance/finish-v1.4.10-ocr.py .github/workflows/finish-v1.4.10-demo.yml
          git add docs/demos README.md README_EN.md README_ZH.md README_JA.md scripts/maintenance/finish-v1.4.10-ocr.py .github/workflows/finish-v1.4.10-demo.yml
          git diff --cached --check
          git diff --cached --stat
          node scripts/release-version.mjs v1.4.10
          git commit -m 'docs: publish full-region OCR walkthrough with six-second ending'
          git fetch origin release/v1.4.10-demo-polish
          test "$(git rev-parse origin/release/v1.4.10-demo-polish)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/release/v1.4.10-demo-polish
      - name: Collect review evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kiri-review-package"
          cp -r "$RUNNER_TEMP/kiri-demo-delivery/." "$RUNNER_TEMP/kiri-review-package/" 2>/dev/null || true
          for file in report.json failure.png ocr-selection-check.json ocr-selection-check.png; do
            cp "$RUNNER_TEMP/kiri-demo-review/$file" "$RUNNER_TEMP/kiri-review-package/" 2>/dev/null || true
          done
          cp "$RUNNER_TEMP/ocr-before.txt" "$RUNNER_TEMP/kiri-review-package/" 2>/dev/null || true
          git log -3 --format='%H %s' > "$RUNNER_TEMP/kiri-review-package/commits.txt"
          git diff 239afb392666f707501e34920ac76fd0dadb766d --stat > "$RUNNER_TEMP/kiri-review-package/diff-stat.txt"
          git archive HEAD -o "$RUNNER_TEMP/kiri-review-package/source.tar"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kiri-v1.4.10-corrected-demo
          path: ${{ runner.temp }}/kiri-review-package/
          retention-days: 5
          if-no-files-found: error
