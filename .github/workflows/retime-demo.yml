name: Retime documentation demo
on:
  push:
    branches: [docs/demo-pacing]
    paths: [.github/workflows/retime-demo.yml]
permissions:
  contents: write
jobs:
  retime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Encode and validate matching 2x MP4 and GIF
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = docs/demo-pacing
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m venv "$RUNNER_TEMP/demo-venv"
          "$RUNNER_TEMP/demo-venv/bin/pip" install --quiet Pillow==11.3.0
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/yuxino/kiri/0cde3d5d7f4943539388e815932efb8c098d9bc9/docs/demos/capture/retime.py -o "$RUNNER_TEMP/retime.py"
          echo "d761d3bdbb5c3903f6654e3d9bc109d8baf026cfe5b899199274e5e1e5cdfd9f  $RUNNER_TEMP/retime.py" | sha256sum -c -
          "$RUNNER_TEMP/demo-venv/bin/python" -I "$RUNNER_TEMP/retime.py" .
          python3 - <<'PY'
          import subprocess
          allowed={'docs/demos/demo.mp4','docs/demos/preview.gif','docs/demos/provenance.json','docs/demos/README.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Unexpected changes: {changed}')
          PY
          git diff --check
          git add -- docs/demos/demo.mp4 docs/demos/preview.gif docs/demos/provenance.json docs/demos/README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: make demo video and GIF play at a natural 2x pace'
          git push origin HEAD:refs/heads/docs/demo-pacing
          git rev-parse HEAD
