[package]
name = "kiri"
version = "1.4.2"
description = "Kiri - a fast, local-first capture workspace"
authors = ["yuxino"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "kiri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [
    "macos-private-api",
    "tray-icon",
    "image-png",
] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sys-locale = "0.3"
dirs = "6"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
os_pipe = "1"
ffmpeg-sidecar = "2"
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10"
sha2 = "0.10"
tempfile = "3"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSData",
    "NSError",
    "NSURL",
    "NSObject",
    "NSValue",
    "NSRunLoop",
] }
objc2-app-kit = { version = "0.3", features = [
    "block2",
    "NSWindow",
    "NSApplication",
    "NSScreen",
    "NSImage",
    "NSPasteboard",
    "NSRunningApplication",
    "NSColor",
    "NSEvent",
    "NSWorkspace",
    "NSMenu",
    "NSStatusItem",
    "NSPanel",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGBase",
    "CGGeometry",
    "CGDirectDisplay",
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGWindow",
    "CGWindowLevel",
    "CGImage",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFRunLoop",
    "CFMachPort",
    "CFDictionary",
    "CFArray",
    "CFString",
    "CFData",
    "CFURL",
    "CFNumber",
    "CFBundle",
    "CFCGTypes",
] }
objc2-image-io = { version = "0.3", default-features = false, features = [
    "std",
    "CGImageSource",
    "CGImageDestination",
    "objc2-core-graphics",
] }
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCShareableContent",
    "SCStream",
    "SCScreenshotManager",
    "SCError",
    "block2",
    "dispatch2",
] }
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
] }
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMTime",
    "CMFormatDescription",
    "CMBlockBuffer",
] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVPixelBufferPool"] }
objc2-vision = { version = "0.3", features = [
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
    "VNDefines",
] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9", features = ["image", "wgc"] }
cpal = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Media_Ocr",
    "Storage_Streams",
    "Graphics_Imaging",
    "Foundation",
] }
windows-capture = "2.0"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

# Keep the shipped Tauri crate self-contained when a contributor has an
# unrelated Cargo workspace in a parent directory.
[workspace]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
